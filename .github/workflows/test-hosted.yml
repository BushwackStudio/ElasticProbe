name: WPProbe.com Unit Tests

env:
  COMPOSER_VERSION: "2"
  COMPOSER_CACHE: "${{ github.workspace }}/.composer-cache"

on:
  schedule:
    - cron:  '0 0 * * *'
  push:
    branches:
      - dev
      - trunk
  pull_request:
    branches:
      - dev
      - '[0-9].[0-9x]*' # Version branches: 4.x.x, 4.1.x, 5.x

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  phpunit:
    name: WPProbe.com
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Start MySQL
      run: sudo systemctl start mysql.service

    - name: Set standard ElasticProbe cache directories
      run: |
        composer config -g cache-dir "${{ env.COMPOSER_CACHE }}"

    - name: Prepare composer cache
      uses: actions/cache@v4
      with:
        path: ${{ env.COMPOSER_CACHE }}
        key: composer-${{ env.COMPOSER_VERSION }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          composer-${{ env.COMPOSER_VERSION }}-

    - name: Set PHP version
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: :php-psr
        coverage: none

    - name: Install dependencies
      run: composer install --ignore-platform-reqs

    - name: Setup WP Tests
      run: |
        bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1
        sleep 10

    - name: PHPUnit
      run: |
         EPROBE_HOST="${{ secrets.WPPROBE_HOST }}" EPROBE_SID=${{ secrets.WPPROBE_SID }} EP_SHIELD_ID="${{ secrets.WPPROBE_SHIELD_ID }}" EP_SHIELD_TOKEN="${{ secrets.WPPROBE_SHIELD_TOKEN }}" composer run-script test
